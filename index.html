<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HMark</title>
    <script>
      ;(function () {
        try {
          const theme = localStorage.getItem('hmark-theme') || 'system'
          const accent = localStorage.getItem('hmark-accent') || '#0969da'
          const dark =
            theme === 'dark' ||
            (theme === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
          document.documentElement.style.setProperty('--accent', accent)
          document.documentElement.style.backgroundColor = dark ? '#0d1117' : '#f6f8fa'
        } catch {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
